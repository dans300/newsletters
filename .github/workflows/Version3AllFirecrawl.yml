name: Version-Firecrawl+ollamaLocal

on:
  schedule:
    - cron: '0 0 10 8 *'
    - cron: '0 0 17 8 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          ls -la
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Ollama ────────────────────────────────────────────────────────────
      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-llama31-8b-gemma3-4b-v1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        env:
          OLLAMA_HOST: 127.0.0.1:11434
        run: |
          set -euo pipefail

          # Avoid competing with an Ollama service already present on the runner.
          pkill -x ollama || true
          sleep 2

          nohup ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ollama.pid"

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi

            if ! kill -0 "$(cat "$RUNNER_TEMP/ollama.pid")" 2>/dev/null; then
              echo "Ollama exited unexpectedly:"
              cat "$RUNNER_TEMP/ollama.log"
              exit 1
            fi

            sleep 2
          done

          echo "Ollama did not become ready:"
          cat "$RUNNER_TEMP/ollama.log"
          exit 1

      - name: Pull models
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          set -euo pipefail
          ollama pull llama3.1:8b
          ollama pull gemma3:4b
          ollama list
          df -h /

      # ── Pipeline ──────────────────────────────────────────────────────────
      - name: Run scripts and isolate outputs
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRE_CRAWL }}
          OLLAMA_HOST: http://localhost:11434
        run: |
          mkdir -p hidden_old_pdfs
          mv *.pdf hidden_old_pdfs/ 2>/dev/null || true

          python AllinOne/oneBigSolution.py

          mkdir -p output

          mv newsletter.json output/
          mv *.pdf output/

      - name: Save output folder
        uses: actions/upload-artifact@v4
        with:
          name: my-scraper-files
          path: output/
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls -t output/*.pdf 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "::warning::No PDF produced, skipping release."
            exit 0
          fi
          TAG="newsletter-$(date +%Y-%m-%d-%H%M)"
          gh release create "$TAG" "$FILE" \
            --title "Newsletter $(date +%d\ %B\ %Y)" \
            --notes "Automated newsletter."