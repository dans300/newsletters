name: News Scraper Pipeline

on:
  schedule:
    - cron: '0 14 * * 4' 
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Set to match your local python --version

      - name: Install dependencies
        run: |
          ls -la
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scripts and isolate outputs
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRE_CRAWL }}
          OPENROUTER_API_KEY: ${{ secrets.OPN_ROUTER }}
          SEND_KEY: ${{ secrets.SEND_KEY }}
        run: |
          # 1. Hide old repository PDFs so they don't get mixed in
          mkdir -p hidden_old_pdfs
          mv *.pdf hidden_old_pdfs/ 2>/dev/null || true
          
          # 2. Run the scripts (they will drop new files in the root folder)
          python script1.py
          python script2.py
          
          # 3. Create the dedicated output folder
          mkdir -p output
          
          # 4. Move ONLY the freshly generated files into the output folder
          mv newsletter.json output/
          mv *.pdf output/

          # 5. Send the email via Resend API
          python send_email.py
          
      - name: Save output folder
        uses: actions/upload-artifact@v4
        with:
          name: my-scraper-files
          path: output/
      